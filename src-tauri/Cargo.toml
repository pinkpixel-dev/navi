[package]
name = "navi"
version = "1.2.1"
description = "MCP client chat app for local and hosted models."
authors = ["Pink Pixel"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "navi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ureq = "2"
tar = "0.4"
flate2 = "1"
zip = "2"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "2", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
http = "1"
