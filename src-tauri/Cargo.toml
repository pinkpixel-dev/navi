[package]
name = "navi"
version = "0.1.0"
description = "MCP client chat app for local and hosted models."
authors = ["Pink Pixel"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "navi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
keyring = "3"
ureq = "2"
tar = "0.4"
flate2 = "1"
zip = "2"
